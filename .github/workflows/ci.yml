name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-cpu-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        mode: [cli, zts]
    steps:
      - uses: actions/checkout@v4

      - name: Build extension and run CPU tests on PHP ${{ matrix.php }} ${{ matrix.mode }}
        run: |
          docker build -f .github/docker/php-compat.Dockerfile \
            --build-arg PHP_VERSION=${{ matrix.php }} \
            --build-arg PHP_MODE=${{ matrix.mode }} -t php-cuda-compat .
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            php-cuda-compat \
            bash -euo pipefail -c '
              php tests/check_pie_package.php
              php -n -l stubs/cuda.stub.php
              bash ./compile.sh
              bash ./run-tests.sh --cpu-only
            '

  draft-release:
    if: github.event.deleted != true && startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-cpu-tests]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          MODULE_VERSION=$(sed -n 's/^#define PHP_CUDA_VERSION "\(.*\)"/\1/p' src/cuda.h | tr -d '\r')
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [[ "$MODULE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match module version $MODULE_VERSION" >&2
            exit 1
          fi

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          FLAGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --generate-notes "${FLAGS[@]}"